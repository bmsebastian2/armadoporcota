<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa demo</title>
  <style>
    :root {
      --bg: #0d1513;
      --line: rgba(255,255,255,.12);
      --text: #edf2f1;
      --muted: rgba(237,233,226,.7);
      --verde: #3E9B84;
      --gold: #D3A04A;
      --gris: #5F6967;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, Arial, sans-serif; }
    body { display: grid; place-items: center; }
    .frame {
      width: min(1200px, 92vw); height: min(760px, 86vh); background: linear-gradient(180deg, #0d1715, #0b1212);
      border: 1px solid var(--line); border-radius: 18px; overflow: hidden; position: relative;
    }
    .hud {
      position: absolute; left: 20px; top: 20px; z-index: 5; backdrop-filter: blur(8px);
      border: 1px solid var(--line); background: rgba(10,18,16,.5); border-radius: 12px; padding: 12px 16px;
    }
    .hud h1 { margin: 0; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; }
    .hud p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    canvas { display: block; width: 100%; height: 100%; }
    a.close {
      position: absolute; right: 18px; top: 18px; z-index: 6; text-decoration: none; color: var(--text);
      background: rgba(10,18,16,.5); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="hud">
      <h1>Mapa por zonas</h1>
      <p>territorio · cobertura · demo 3D</p>
    </div>
    <a class="close" href="index.html">← volver</a>
    <canvas id="scene"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Mismo lenguaje visual que la torre (cajas + bordes + estado por color),
    // pero aplicado a un plano de loteo: cada caja es un lote, no un piso.
    const COLORES = { disp: 0x3E9B84, res: 0xD3A04A, vend: 0x5E6968 };

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1513);
    scene.fog = new THREE.Fog(0x0d1513, 26, 50);

    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 400);
    camera.position.set(0, 14, 20);
    camera.lookAt(0, 0, 0);

    const hemi = new THREE.HemisphereLight(0xdde9e5, 0x0d1513, 0.85);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xfff4dc, 0.9);
    dir.position.set(-16, 22, 14);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    const sc = dir.shadow.camera;
    sc.left = -22; sc.right = 22; sc.top = 18; sc.bottom = -18; sc.near = 4; sc.far = 60;
    scene.add(dir);

    // Todo lo que gira en cámara lenta va dentro de este grupo.
    const orbita = new THREE.Group();
    scene.add(orbita);

    /* ---- Plano de loteo: filas x columnas de lotes, con calles entre medio ---- */
    const FILAS = 6, COLUMNAS = 8;
    const ANCHO = 1.9, PROF = 2.4, ALTO = 0.4;
    const CALLE_X = 0.55, CALLE_Z = 0.7;
    const PASO_X = ANCHO + CALLE_X, PASO_Z = PROF + CALLE_Z;

    const terreno = new THREE.Mesh(
      new THREE.PlaneGeometry(COLUMNAS * PASO_X + 4, FILAS * PASO_Z + 4),
      new THREE.MeshStandardMaterial({ color: 0x233130, roughness: 0.95 })
    );
    terreno.rotation.x = -Math.PI / 2;
    terreno.position.y = -0.02;
    terreno.receiveShadow = true;
    orbita.add(terreno);

    const geoLote  = new THREE.BoxGeometry(ANCHO, ALTO, PROF);
    const bordes   = new THREE.EdgesGeometry(geoLote);
    let semilla = 4711;
    const azar = () => (semilla = (semilla * 1103515245 + 12345) % 2147483648) / 2147483648;

    for (let f = 0; f < FILAS; f++) {
      for (let c = 0; c < COLUMNAS; c++) {
        const r = azar();
        const color = r < 0.16 ? COLORES.vend : r < 0.34 ? COLORES.res : COLORES.disp;
        const lote = new THREE.Mesh(geoLote, new THREE.MeshStandardMaterial({
          color, roughness: 0.45, metalness: 0.05
        }));
        lote.position.set(
          (c - (COLUMNAS - 1) / 2) * PASO_X,
          ALTO / 2,
          (f - (FILAS - 1) / 2) * PASO_Z
        );
        lote.castShadow = lote.receiveShadow = true;
        orbita.add(lote);

        const linea = new THREE.LineSegments(bordes,
          new THREE.LineBasicMaterial({ color: 0x0E1513, transparent: true, opacity: 0.5 }));
        linea.position.copy(lote.position);
        orbita.add(linea);
      }
    }

    function resize() {
      const { clientWidth, clientHeight } = canvas;
      renderer.setSize(clientWidth, clientHeight, false);
      camera.aspect = clientWidth / clientHeight;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    resize();

    const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function animate() {
      requestAnimationFrame(animate);
      if (!quieto) orbita.rotation.y += 0.0025;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
